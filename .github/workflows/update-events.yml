name: Update events

on:
  schedule:
    # Every 6 hours (UTC). GitHub may delay scheduled runs by a few minutes.
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-events.yml'

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch events
        run: node scripts/fetch-events.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          msg="data: refresh events $(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "$msg"
          # Generated files: if someone pushed meanwhile, re-create our commit on top
          # of the new tip instead of trying to merge JSON.
          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "Push rejected, retrying on top of latest main (attempt $attempt)"
            git fetch origin main
            git reset --soft origin/main
            git commit -m "$msg" || true
          done
          exit 1
